name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15] # Apple Silicon macOS; pinned nixpkgs no longer supports Intel Macs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Format, JVM, bridge, tooling and documentation checks
        run: nix flake check -L --keep-going
      - name: Build release artifacts
        if: runner.os == 'Linux'
        run: nix build .#release -L --out-link release
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        with:
          name: vane-${{ github.sha }}
          path: release/*
          if-no-files-found: error

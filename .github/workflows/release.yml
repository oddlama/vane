name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v1.24.0"
        required: true
      modrinth:
        description: "Publish to Modrinth instead (GitHub release must already be published)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Validate and build
        run: |
          nix flake check -L --keep-going
          nix build .#release -L
      - name: Create GitHub draft and upload assets (never overwrite published assets)
        if: ${{ !inputs.modrinth }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix run .#publish-github -- --tag "$TAG" --confirm
      - name: Publish reviewed release to Modrinth
        if: ${{ inputs.modrinth }}
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: nix run .#publish-modrinth -- --tag "$TAG" --confirm

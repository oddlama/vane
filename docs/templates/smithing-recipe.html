        data-mctooltip="minecraft:netherite_upgrade_smithing_template"

        class="absolute mctooltip left-[25%] top-[57.142857%] w-[9.090909%] h-[19.047619%] is-pixelated"

        class="absolute mctooltip left-[55.681818%] top-[57.142857%] w-[9.090909%] h-[19.047619%] is-pixelated"

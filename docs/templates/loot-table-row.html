<tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700">
    <th scope="row" class="px-6 py-4 font-medium text-gray-900 dark:text-white whitespace-nowrap">
        <img
            class="mr-4 w-8 h-8 min-w-8 min-h-8 mctooltip is-pixelated"
            src="{{ loot_table.row.item.icon }}"
            data-mctooltip="{{ loot_table.row.item.name }}"
            alt=""
        />
    </th>
    <td class="px-6 py-4">{{ loot_table.row.chance }}</td>
    <td class="px-6 py-4">{{ loot_table.row.amount }}</td>
    {{ loot_table.col.where }}
</tr>

# DO NOT CHANGE! The version of this language file. Used to determine
# if the file needs to be updated.
Version: 7
# The corresponding language code used in resource packs. Used for
# resource pack generation. Typically, this is a combination of the
# language code (ISO 639) and the country code (ISO 3166).
ResourcePackLangCode: 'zh_cn'

TabTag: " §c[忙碌]"

CommandBusybar:
  Usage: "%1$s §7<§alink§7|§aunlink§7|§astatus§7|§abusy§7|§alist§7|§aclear§7|§arevoke§7|§arotatekey§7>"
  Description: "将你的 BUSY Bar 连接到此服务器。"
  Help: "§alink§7:§r 为你的 BUSY Bar 桥接程序创建令牌。再次执行会替换旧令牌。\n\
    §aunlink§7:§r 撤销你的令牌，断开桥接程序并关闭专注模式。\n\
    §astatus§7:§r 显示你的桥接程序是否已连接。\n\
    §abusy §7<§aon§7|§aoff§7>:§r 开启或关闭专注模式，效果与拨动 BUSY Bar 的选择开关相同。\n\
    §alist§7 (管理员):§r 列出已绑定 BUSY Bar 或开启专注模式的玩家。\n\
    §aclear §7<§b玩家§7> (管理员):§r 关闭某位玩家的专注模式。\n\
    §arevoke §7<§b玩家§7> (管理员):§r 撤销某位玩家的令牌并关闭其专注模式。\n\
    §arotatekey§7 (管理员):§r 更换 TLS 密钥。所有玩家都需要重新执行 §blink§r。"
  Linked: "§7将下面这一行粘贴到桥接程序中。它包含你的令牌，只显示一次。"
  ClickToCopy: "§7点击复制"
  NoPublicUrl: "§7此服务器尚未为 BUSY Bar 桥接程序设置地址。请让管理员在 vane-busybar 配置中设置 §bPublicUrl§7。"
  Unlinked: "§7你的 BUSY Bar 令牌已撤销。"
  NotLinked: "§7尚未绑定 BUSY Bar。使用 §b/busybar link§7 创建令牌。"
  Status: "§7BUSY Bar 已绑定。已连接的桥接程序：%1$s§7。专注模式：%2$s"
  BusyOn: "§c开"
  BusyOff: "§a关"
  BusySet: "§7专注模式：%1$s"
  ListHeader: "§7BUSY Bar 玩家（%1$s§7）："
  ListEntry: "§7- §b%1$s§7 · 桥接程序：%2$s§7 · 专注：%3$s§7 · %4$s"
  ListEmpty: "§7没有玩家绑定 BUSY Bar 或开启专注模式。"
  LinkedYes: "§a已绑定"
  LinkedNo: "§7未绑定"
  Cleared: "§7已关闭 §b%1$s§7 的专注模式。"
  Revoked: "§7已撤销 §b%1$s§7 的 BUSY Bar 令牌。"
  NothingToDo: "§b%1$s§7 没有可清除的内容：既没有 BUSY Bar 令牌，也没有开启专注模式。"
  KeyRotated: "§7已生成新的 TLS 密钥。所有使用 BUSY Bar 的玩家都需要重新执行 §b/busybar link§7。"
  KeyNotRotatable: "§7仅在 §bTls: auto§7 时可用。此服务器使用自己的证书或未启用 TLS。"
  ServedByProxy: "§7此网络的 BUSY Bar 由代理服务器管理。请在代理服务器上使用 §b/busybar§7。"

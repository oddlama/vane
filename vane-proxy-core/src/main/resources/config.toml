[AuthMultiplex]

# Define your auth multiplexers
# These allow the specified UUIDs to join the server
# multiple times with a fake UUID. IDs must be > 0.

# Example:
#
# [AuthMultiplex.ID_NUMBER]
# Port = 25566
# AllowedUuids = ["b4a6717f-e3ab-4348-8e18-022827ef3177"]
#
# (Where ID_NUMBER is a nonzero integer)
#
# This will allow *only* UUID "b4a6717f-e3ab-4348-8e18-022827ef3177"
# to use this multiplexer. You can add as many UUIDs as you want.
#
# To make it public, leave out the `AllowedUuids` field.
#
# It is *not* possible to have multiple multiplexers on the same port.

[ManagedServers]

# Define your managed servers
#
# NOTE: No field is necessary! You can leave out anything you don't
#       want, including entire sections!

# Example:
#
#   [ManagedServers.MyServer]
#
#   # The server display name (used for messages and substitutions)
#
#   DisplayName = "§6> §6§lMy Minecraft Server§6 <"
#
#       # The online configuration, things to show in the server list
#       # when the server is online
#
#       [ManagedServers.MyServer.Online]
#
#       # The server favicon (absolute path or relative to proxy directory)
#       Favicon = "../{SERVER}/server-icon.png"
#
#       # The MOTD for the server list (up to two lines)
#       MOTD = "{SERVER_DISPLAY_NAME}\n§aowo§7 | {QUOTE}"
#
#       # A list of quotes for substitutions
#       Quotes = ["Ah, yes."]
#
#       # The offline configuration, for when the server is offline
#
#       [ManagedServers.MyServer.Offline]
#       Favicon = "../{SERVER}/server-icon-offline.png"
#       MOTD = "{SERVER_DISPLAY_NAME}\n§cowo§7 | {QUOTE}"
#       Quotes = ["Paniik!"]
#
#       # Automatic start settings
#       [ManagedServers.MyServer.Start]
#
#       # The command to execute when the first player joins while the server is offline
#       # {SERVER}: The server identifier
#
#       CMD = ["/path/to/startscript", "arg1", "will also substitute {SERVER}"]
#
#       # How long the start command is allowed to run before it is killed
#       # If unspecified, it will be 10 seconds
#
#       Timeout = 10
#
#       # The kick message to send to the player that started the server
#       # {SERVER}: The server identifier
#       # {SERVER_DISPLAY_NAME}: The server display name
#
#       KickMsg = "{SERVER_DISPLAY_NAME} §7is being started.\n§7Try again in §b10 Seconds§7 \\(^-^)/"


[BusyBar]

# Serves BUSY Bar desk displays (https://busy.bar) for the whole network.
# Players run /busybar link on the proxy and paste the pairing string into
# their bridge, which then follows them across servers. Backends running
# vane-busybar report their events through the link below; see the
# vane-busybar module documentation.

Enabled = false

# Address and port the bridges connect to. They connect from players' homes,
# so this port has to be reachable from the internet.
Bind = "0.0.0.0"
Port = 9123

# Address bridges reach this proxy at, put into the pairing string by
# /busybar link: a host such as mc.example.com or 203.0.113.7, which gets
# Port added, or a full URL. Required, since the proxy cannot know it.
PublicUrl = ""

# auto: HTTPS with a self-signed certificate generated on first start;
#       bridges pin its key through the pairing string.
# keystore: HTTPS with the PKCS#12 certificate in TlsKeystore.
# off: plain HTTP, only behind a TLS reverse proxy or on a trusted LAN.
Tls = "auto"
TlsKeystore = ""
TlsKeystorePassword = ""

# Requests a linked BUSY Bar may send. Remove an entry to disable it.
AllowedActions = ["presence.set", "autostop.abort"]

    [BusyBar.Link]

    # Address and port backends connect to. Keep this on the network the
    # proxy shares with its backends; players never need it.
    Bind = "127.0.0.1"
    Port = 9124

    # Shared with every backend's ProxyLinkSecret, at least 16 characters.
    # It is never sent over the link, only used to prove that both sides
    # know it. Generate one with: openssl rand -base64 32
    Secret = ""
